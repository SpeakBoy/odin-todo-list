<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Odin Todo List</title>
    </head>
    <body>
        <header>
            <h1>Todo List</h1>
            <div id="buttons">
                <button id="create-project-button">Create Project</button>
                <button id="create-todo-button">Create Todo</button>
            </div>
        </header>
        <main>
            <h2>Projects</h2>
            <div id="projects"></div>
        </main>
        <dialog id="create-project-dialog">
            <form id="create-project-form">
                <h2>Create Project</h2>
                <div>
                    <label for="project-title">Title:</label>
                    <input type="text" id="project-title" name="project-title" required>
                </div>
                <button id="cancel-create-project" type="reset">Cancel Project</button>
                <button id="confirm-create-project" type="submit">Create Project</button>
            </form>
        </dialog>
        <dialog id="create-todo-dialog">
            <form id="create-todo-form">
                <h2>Create Todo</h2>
                <div>
                    <label for="todo-project">Project:</label>
                    <select id="todo-project" name="todo-project" required>
                    </select>
                </div>
                <div>
                    <label for="todo-title">Title:</label>
                    <input type="text" id="todo-title" name="todo-title" required>
                </div>
                <div>
                    <label for="todo-description">Description:</label>
                    <textarea id="todo-description" name="todo-description" required></textarea>
                </div>
                <div>
                    <label for="todo-due-date">Due Date:</label>
                    <input type="date" id="todo-due-date" name="todo-due-date" required>
                </div>
                <div>
                    <label for="todo-priority">Priority:</label>
                    <select id="todo-priority" name="todo-priority" required>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>
                </div>
                <button id="cancel-create-todo" type="reset">Cancel Todo</button>
                <button id="confirm-create-todo" type="submit">Create Todo</button>
            </form>
        </dialog>
        <dialog id="update-todo-dialog">
            <form id="update-todo-form">
                <h2>Update Todo</h2>
                <div>
                    <label for="update-todo-title">Title:</label>
                    <input type="text" id="update-todo-title" name="update-todo-title" required>
                </div>
                <div>
                    <label for="update-todo-description">Description:</label>
                    <textarea id="update-todo-description" name="update-todo-description" required></textarea>
                </div>
                <div>
                    <label for="update-todo-due-date">Due Date:</label>
                    <input type="date" id="update-todo-due-date" name="update-todo-due-date" required>
                </div>
                <div>
                    <label for="update-todo-priority">Priority:</label>
                    <select id="update-todo-priority" name="update-todo-priority" required>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>
                </div>
                <input type="hidden" id="update-todo-id">
                <button id="cancel-update-todo" type="reset">Cancel</button>
                <button id="confirm-update-todo" type="submit">Confirm</button>
            </form>
        </dialog>
    </body>
</html>
