<!doctype html><html lang=en><head><meta charset=UTF-8><title>Odin Todo List</title><script defer src=main.js></script></head><body><header><h1>Todo List</h1><div id=buttons><button id=create-project-button>Create Project</button> <button id=create-todo-button>Create Todo</button></div></header><main><h2>Projects</h2><div id=projects></div></main><dialog id=create-project-dialog><form id=create-project-form><h2>Create Project</h2><div><label for=project-title>Title:</label> <input id=project-title name=project-title required></div><button id=cancel-create-project type=reset>Cancel</button> <button id=confirm-create-project type=submit>Confirm</button></form></dialog><dialog id=create-todo-dialog><form id=create-todo-form><h2>Create Todo</h2><div><label for=todo-project>Project:</label> <select id=todo-project name=todo-project required></select></div><div><label for=todo-title>Title:</label> <input id=todo-title name=todo-title required></div><div><label for=todo-description>Description:</label> <textarea id=todo-description name=todo-description required></textarea></div><div><label for=todo-due-date>Due Date:</label> <input type=date id=todo-due-date name=todo-due-date required></div><div><label for=todo-priority>Priority:</label> <select id=todo-priority name=todo-priority required><option value=high>High<option value=medium>Medium<option value=low>Low</select></div><button id=cancel-create-todo type=reset>Cancel</button> <button id=confirm-create-todo type=submit>Confirm</button></form></dialog><dialog id=update-todo-dialog><form id=update-todo-form><h2>Update Todo</h2><div><label for=update-todo-title>Title:</label> <input id=update-todo-title name=update-todo-title required></div><div><label for=update-todo-description>Description:</label> <textarea id=update-todo-description name=update-todo-description required></textarea></div><div><label for=update-todo-due-date>Due Date:</label> <input type=date id=update-todo-due-date name=update-todo-due-date required></div><div><label for=update-todo-priority>Priority:</label> <select id=update-todo-priority name=update-todo-priority required><option value=high>High<option value=medium>Medium<option value=low>Low</select></div><input type=hidden id=update-todo-id> <button id=cancel-update-todo type=reset>Cancel</button> <button id=confirm-update-todo type=submit>Confirm</button></form></dialog><dialog id=delete-todo-dialog><form id=delete-todo-form><h2>Delete Todo</h2><div><label for=delete-todo-title>Title:</label> <input id=delete-todo-title name=delete-todo-title disabled></div><div><label for=delete-todo-description>Description:</label> <textarea id=delete-todo-description name=delete-todo-description disabled></textarea></div><div><label for=delete-todo-due-date>Due Date:</label> <input type=date id=delete-todo-due-date name=delete-todo-due-date disabled></div><div><label for=delete-todo-priority>Priority:</label> <select id=delete-todo-priority name=delete-todo-priority disabled><option value=high>High<option value=medium>Medium<option value=low>Low</select></div><input type=hidden id=delete-todo-id><p>Are you sure you want to delete this?</p><button id=cancel-delete-todo type=reset>Cancel</button> <button id=confirm-delete-todo type=submit>Confirm</button></form></dialog></body></html>
